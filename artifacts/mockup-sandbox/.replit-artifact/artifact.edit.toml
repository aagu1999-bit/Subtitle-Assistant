kind = "web"
previewPath = "/"
title = "Subtitle Burner"
version = "1.0.0"
id = "XegfDyZt7HqfW2Bb8Ghoy"

[[services]]
localPort = 8081
name = "Start application"
paths = ["/"]

[services.development]
run = "cd /home/runner/workspace/artifacts/subtitle-burner && PORT=8081 python app.py"

[services.production]
run = "cd /home/runner/workspace/artifacts/subtitle-burner && gunicorn -w 1 --threads 8 -b 0.0.0.0:$PORT app:app"
build = "pip install -r /home/runner/workspace/artifacts/subtitle-burner/requirements.txt"
deploymentTarget = "vm"

[[services]]
localPort = 8082
name = "Component Preview Server"
paths = ["/__mockup"]

[services.env]
PORT = "8082"
BASE_PATH = "/__mockup"

[services.development]
run = "pnpm --filter @workspace/mockup-sandbox run dev"
