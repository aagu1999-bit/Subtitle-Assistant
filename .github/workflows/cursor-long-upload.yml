# Link GitHub Actions → Cursor Agent for the long-upload / Timeline path.
#
# Cursor Environment Secrets (Cloud Agent) and GitHub Actions secrets are
# SEPARATE. Nothing syncs automatically.
#
# What you need to do once:
# 1) Cursor dashboard → Cloud Agents → your environment → Secrets
#    Add any of: PEXELS_API_KEY, UNSPLASH_ACCESS_KEY, GOOGLE_CSE_API_KEY,
#    GOOGLE_CSE_CX, GEMINI_API_KEY, HF_TOKEN (for the Cloud Agent / Studio).
# 2) Create a Cursor CLI API key (dashboard → Integrations / API).
# 3) GitHub → Settings → Secrets and variables → Actions
#    Add CURSOR_API_KEY (required for the agent job below).
#    Optionally mirror the same provider keys if CI should hit those APIs.
# 4) Run this workflow via Actions → "Cursor long-upload" → Run workflow.
#
# Docs: https://cursor.com/docs/cli/github-actions

name: Cursor long-upload

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "artifacts/subtitle-burner/app.py"
      - "artifacts/subtitle-burner/static/timeline.js"
      - "artifacts/subtitle-burner/static/app.js"
      - "artifacts/subtitle-burner/templates/index.html"
      - ".github/workflows/cursor-long-upload.yml"

jobs:
  smoke:
    name: Long-upload smoke (no Cursor key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax (app.py)
        run: python3 -m py_compile artifacts/subtitle-burner/app.py
      - name: Long-upload surface markers present
        run: |
          set -e
          grep -q "win_start" artifacts/subtitle-burner/app.py
          grep -q "acceptPendingBrollAsMain" artifacts/subtitle-burner/static/timeline.js
          grep -q "readyOpenLongFormBtn" artifacts/subtitle-burner/templates/index.html
          grep -q "openLongFormFromReady" artifacts/subtitle-burner/static/app.js
          grep -q "tlBrollScope" artifacts/subtitle-burner/templates/index.html
          echo "Long-upload markers OK"

  cursor-agent:
    name: Cursor CLI long-upload pass
    runs-on: ubuntu-latest
    needs: smoke
    # Only when manually dispatched — avoids burning API quota on every PR.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Require CURSOR_API_KEY
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "::error::Add repository secret CURSOR_API_KEY (Cursor CLI API key)."
            echo "See workflow header comments for the full connect checklist."
            exit 1
          fi

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run Cursor agent on long-upload path
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          # Optional mirrors — only used if you also set them in Actions secrets.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          agent -p "Review the long-form upload Timeline path in artifacts/subtitle-burner.
          Focus on: Edit as Long-form (16:9) ingest CTA, windowed /fetch-auto-overlays
          (start/end + tlBrollScope), Accept as Main cutaway vs Overlay, and still-image
          Main cutaway rendering. Report bugs or missing wiring. Do NOT commit or push;
          only modify files if you find a clear bug, and keep changes minimal." \
            --model gpt-5
