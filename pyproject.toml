[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0.0",
    "flask>=3.0.0",
    "requests>=2.33.1",
    # Serves the burner in deployment. Flask's built-in server prints
    # "do not use it in a production deployment" for good reason: it is
    # single-process and has no request timeouts or worker supervision.
    "gunicorn>=21.0.0",
    # Fetch source footage from a URL instead of uploading it. Unpinned on
    # purpose: extractors break whenever a site changes, and the fix only
    # ships in a newer release.
    "yt-dlp",
    # Face detection and the person matte. Pinned below 0.10.22: MediaPipe
    # removed the legacy `mp.solutions` API, and this app is written against
    # it (mp.solutions.face_detection, mp.solutions.selfie_segmentation).
    # An unpinned install resolves to a release where `mediapipe.solutions`
    # does not exist and both features raise AttributeError at runtime.
    "mediapipe>=0.10.5,<0.10.22",
    "opencv-python-headless>=4.10.0",
    # WhisperX is deliberately absent: it pulls torch (~2-3 GB) and the
    # alignment degrades to Whisper's own timings without it. See
    # requirements.txt to install it.
]
