[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0.0",
    "flask>=3.0.0",
    "requests>=2.33.1",
    # Serves the burner in deployment. Flask's built-in server prints
    # "do not use it in a production deployment" for good reason: it is
    # single-process and has no request timeouts or worker supervision.
    "gunicorn>=21.0.0",
    # Fetch source footage from a URL instead of uploading it. Unpinned on
    # purpose: extractors break whenever a site changes, and the fix only
    # ships in a newer release.
    "yt-dlp",
    # Face detection and the person matte. Pinned below 0.10.22: MediaPipe
    # removed the legacy `mp.solutions` API this app is written against, so an
    # unpinned install resolves to a release where both features raise
    # AttributeError at runtime.
    "mediapipe>=0.10.5,<0.10.22",
    "opencv-python-headless>=4.10.0",
    # Speaker diarization: who is talking, and when. Everything downstream of
    # that question depends on it -- speaker caption colours, aiming a punch
    # at whoever is speaking, the two-person split-screen, and speaker-based
    # 9:16 reframing. /analyze-reframe refuses to start without it, so a
    # missing pyannote takes the whole Analyze step down, faces included.
    #
    # This was declared only in requirements.txt until an environment sync
    # pruned it and every speaker feature went dormant in production. One
    # list is the fix; see the matching note in requirements.txt.
    "pyannote.audio>=3.1.0",
    # Pinned to the last torch/torchaudio that pyannote 3.x can actually run
    # on. torchaudio DEPRECATED `AudioMetaData` in 2.8 and REMOVED it in 2.9;
    # pyannote.audio 3.x still references it, and pyannote declares torchaudio
    # with no upper bound -- so an unconstrained resolve takes the newest
    # (2.11.1 when this was written) and diarization dies at import with
    # `AttributeError: module 'torchaudio' has no attribute 'AudioMetaData'`.
    #
    # Same shape as the mediapipe pin above: a library dropped an API its
    # dependent is written against, and nothing in the metadata records it.
    # The two must also share a minor -- a torch/torchaudio mismatch is its
    # own failure mode.
    #
    # The way OUT of this pin is pyannote.audio 4.x, which does not use the
    # removed API. It is not taken here because 4.x requires torchcodec>=0.7.0
    # (which would not resolve) and is a real API migration that wants testing
    # against a real torch install, not a hopeful version bump.
    "torch>=2.8.0,<2.9.0",
    "torchaudio>=2.8.0,<2.9.0",
    # Polish: the source rough-cut that trims silence before any captions are
    # burned. /polish/ping probes for both and reports which engines exist,
    # so losing them degrades rather than crashes -- but the button stops
    # doing anything, which is indistinguishable from broken.
    "auto-editor>=29.0.0",
    "moviepy>=2.0.0",
    # WhisperX is deliberately absent, but NOT for the reason this comment
    # used to give. It said "it pulls torch (~2-3 GB)" -- and pyannote above
    # pulls torch too, so that was never the deciding factor. The real trade
    # is install size against alignment quality: without WhisperX, word
    # timings fall back to Whisper's own, which drift slightly against the
    # audio. _refine_word_alignment already degrades silently to exactly
    # that, so its absence costs tightness, not captions.
]
